name: PMSF-X professional research validation

on:
  push:
    branches:
      - main
    paths:
      - "research/run.txt"

jobs:
  validate-multihorizon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for live research endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Research endpoint check $attempt/30"
            if curl --fail --silent --show-error --max-time 20               https://pmsfx-nano.onrender.com/api/research/multihorizon/AAPL               -o /tmp/aapl.json; then
              echo "Research endpoint is live."
              break
            fi
            sleep 20
          done
          test -s /tmp/aapl.json

      - name: Validate AAPL multi-horizon meta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open("/tmp/aapl.json", "r", encoding="utf-8") as fh:
              payload = json.load(fh)

          validation = payload["validation"]
          print(json.dumps({
              "symbol": "AAPL",
              "status": validation.get("status"),
              "validated": validation.get("validated"),
              "sample_counts": validation.get("sample_counts"),
              "outer_fold_count": validation.get("outer_fold_count"),
              "usable_fold_count": validation.get("usable_fold_count"),
              "oos_count": validation.get("oos_count"),
              "metrics": validation.get("metrics"),
              "primary_300s_metrics": validation.get("primary_300s_metrics"),
              "delta_brier_vs_300s": validation.get("delta_brier_vs_300s"),
              "bootstrap_vs_baseline": validation.get("bootstrap"),
              "bootstrap_vs_300s": validation.get("primary_300s_bootstrap"),
              "gate": validation.get("gate"),
              "research_run_id": payload.get("research_run_id"),
          }, indent=2))
          PY
