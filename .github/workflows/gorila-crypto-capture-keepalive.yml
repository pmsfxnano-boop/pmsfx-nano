name: gorila-crypto-capture-keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify canonical capture and frontend market contract
        run: |
          set -euo pipefail

          BASE="https://gorila-crypto-cleanroom-binance-capture.onrender.com"
          HEALTH_URL="$BASE/api/crypto/health"
          MARKET_URL="$BASE/api/crypto/market/stream?cursor=0&limit=36"
          EVIDENCE_URL="$BASE/api/crypto/evidence"

          for attempt in 1 2 3 4 5 6; do
            tmp_headers="$(mktemp)"
            tmp_body="$(mktemp)"
            tmp_evidence="$(mktemp)"

            health_ok=0
            market_ok=0
            evidence_ok=0
            cors_ok=0

            if curl --fail --silent --show-error --max-time 20 "$HEALTH_URL" >/dev/null; then
              health_ok=1
            fi

            if curl --fail --silent --show-error --max-time 20               -D "$tmp_headers"               "$MARKET_URL" >"$tmp_body"; then
              market_ok=1
              if tr -d "\r" < "$tmp_headers" | grep -qi "^access-control-allow-origin: \*"; then
                cors_ok=1
              fi
            fi

            if curl --fail --silent --show-error --max-time 20 "$EVIDENCE_URL" >"$tmp_evidence"; then
              evidence_ok=1
            fi

            contract_ok=0
            if [ "$health_ok" -eq 1 ] && [ "$market_ok" -eq 1 ] && [ "$evidence_ok" -eq 1 ] && [ "$cors_ok" -eq 1 ]; then
              if python - "$tmp_body" "$tmp_evidence" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              market = json.load(fh)
          with open(sys.argv[2], encoding="utf-8") as fh:
              evidence = json.load(fh)

          required_market = {"status", "next_cursor", "symbols", "events", "forecast"}
          missing_market = required_market - market.keys()
          if missing_market:
              raise SystemExit(f"market contract missing keys: {sorted(missing_market)}")
          if not market["symbols"]:
              raise SystemExit("market contract returned no symbols")
          if not market["events"]:
              raise SystemExit("market contract returned no persisted events yet")
          forecast = market["forecast"]
          if forecast.get("automatic_promotion") is not False:
              raise SystemExit("automatic promotion must remain disabled")
          if forecast.get("execution") is not False:
              raise SystemExit("execution must remain disabled")

          required_evidence = {
              "study", "cohort", "quality_gate", "research", "pit_oos",
              "forecast_shadow", "lead_lag_shadow", "opportunity_shadow",
              "regime", "opportunity_clock",
          }
          missing_evidence = required_evidence - evidence.keys()
          if missing_evidence:
              raise SystemExit(f"evidence contract missing keys: {sorted(missing_evidence)}")

          clock = evidence["opportunity_clock"]
          if clock.get("validated") and clock.get("state") != "ACTIVE":
              raise SystemExit("validated Opportunity Clock must be ACTIVE")
          if not clock.get("validated") and clock.get("state") != "LOCKED":
              raise SystemExit("unvalidated Opportunity Clock must be LOCKED")
          regime = evidence["regime"]
          if regime.get("validated") is not False:
              raise SystemExit("observed regime layer must remain explicitly unvalidated")

          print(
              "Market + evidence contracts OK:",
              f"market_status={market['status']}",
              f"symbols={len(market['symbols'])}",
              f"events={len(market['events'])}",
              f"next_cursor={market['next_cursor']}",
              f"clock={clock['state']}",
              f"quality={evidence['quality_gate']['state']}",
              f"pit_oos={evidence['pit_oos']['state']}",
          )
          PY
              then
                contract_ok=1
              fi
            fi

            if [ "$health_ok" -eq 1 ] && [ "$market_ok" -eq 1 ] && [ "$evidence_ok" -eq 1 ] && [ "$cors_ok" -eq 1 ] && [ "$contract_ok" -eq 1 ]; then
              rm -f "$tmp_headers" "$tmp_body" "$tmp_evidence"
              echo "Render capture + market + evidence + CORS OK on attempt $attempt"
              exit 0
            fi

            rm -f "$tmp_headers" "$tmp_body" "$tmp_evidence"
            sleep 10
          done

          echo "Render capture/market contract check failed after retries"
          exit 1
