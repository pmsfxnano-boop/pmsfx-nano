name: V0 real historical OOS PR

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  v0-real-historical:
    runs-on: ubuntu-latest
    steps:
      - name: Clone current main scoring code
        run: git clone --depth 1 https://github.com/${{ github.repository }}.git scoring

      - name: Run V0 against raw real Render/Tiingo history
        shell: bash
        run: |
          set -u
          base="https://pmsfx-nano.onrender.com/api/research/v0-ofi/raw"
          for symbol in TSLA; do
            echo "========== BEGIN $symbol =========="
            curl -sS --fail --max-time 300 "$base/$symbol" -o "/tmp/$symbol.json"
            python - "$symbol" <<'PY'
import json,sys
sys.path.insert(0, "scoring")
from quant.v0_ofi import run_v0_research
s=sys.argv[1]
payload=json.load(open(f"/tmp/{s}.json"))
rows=payload["rows"]
result=run_v0_research(rows, symbol=s)
print(json.dumps({
  "symbol":s,
  "raw_row_count":payload.get("row_count"),
  "raw_first_bar":payload.get("first_bar"),
  "raw_last_bar":payload.get("last_bar"),
  "bars_used":result.get("bars_used"),
  "validation_summary":result.get("validation_summary"),
  "horizons":{
    h:{
      "sample_count":v.get("sample_count"),
      "oos_count":(v.get("evaluation") or {}).get("oos_count"),
      "fold_count":(v.get("evaluation") or {}).get("fold_count"),
      "accuracy":(v.get("evaluation") or {}).get("accuracy"),
      "auc":(v.get("evaluation") or {}).get("auc"),
      "brier":(v.get("evaluation") or {}).get("brier"),
      "baseline_brier":(v.get("evaluation") or {}).get("baseline_brier"),
      "brier_skill":(v.get("evaluation") or {}).get("brier_skill"),
      "log_loss":(v.get("evaluation") or {}).get("log_loss"),
      "baseline_log_loss":(v.get("evaluation") or {}).get("baseline_log_loss"),
      "log_loss_improvement":(v.get("evaluation") or {}).get("log_loss_improvement"),
      "ece":(v.get("evaluation") or {}).get("ece"),
      "validated":(v.get("evaluation") or {}).get("validated"),
    } for h,v in result.get("horizons",{}).items()
  }
}, indent=2))
PY
            echo "========== END $symbol =========="
          done

# TSLA-only rerun after Render 502
