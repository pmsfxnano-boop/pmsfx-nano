name: Gorila Argentum Search Audit

on:
  workflow_dispatch:

concurrency:
  group: gorila-argentum-search-audit
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  search-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt
      - name: Search-aware PBO/DSR
        run: set -o pipefail; python research/gorila_search_audit_oos.py | tee gorila-search-audit.json
      - name: Upload search audit
        uses: actions/upload-artifact@v4
        with:
          name: gorila-search-audit
          path: gorila-search-audit.json
