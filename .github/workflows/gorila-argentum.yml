name: Gorila Argentum CI

on:
  push:
    branches: [gorila-argentum-v0]
  pull_request:
    branches: [gorila-argentum-v0]

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt pytest
      - name: Unit tests
        run: pytest -q tests/test_gorila_math.py tests/test_prediction.py tests/test_regime_validation.py tests/test_signal_timing.py
      - name: Import smoke
        run: python -c "from gorila_argentum.app import app; print(app.title, app.version)"
      - name: Core Argentine OOS research
        run: set -o pipefail; python research/gorila_oos.py | tee gorila-oos.json
      - name: Dynamic coupling OOS research
        run: set -o pipefail; python research/gorila_coupling_oos.py | tee gorila-coupling-oos.json
      - name: Coupling regime OOS research
        run: set -o pipefail; python research/gorila_coupling_regime_oos.py | tee gorila-coupling-regime-oos.json
      - name: Coupling gate OOS research
        run: set -o pipefail; python research/gorila_coupling_gate_oos.py | tee gorila-coupling-gate-oos.json
      # Execution costs are modeled as round-trip bps per trade.
      - name: Multi-horizon purged walk-forward OOS research
        run: set -o pipefail; python research/gorila_multihorizon_wfo.py | tee gorila-multihorizon-wfo.json
      - name: Execution robustness OOS research
        run: set -o pipefail; python research/gorila_execution_robustness_oos.py | tee gorila-execution-robustness-oos.json
      - name: Nested execution selection OOS research
        run: set -o pipefail; python research/gorila_nested_execution_selection_oos.py | tee gorila-nested-execution-selection-oos.json
      - name: Cross-sectional relative OOS research
        run: set -o pipefail; python research/gorila_cross_sectional_oos.py | tee gorila-cross-sectional-oos.json
      - name: Pairwise ranking OOS research
        run: set -o pipefail; python research/gorila_pairwise_rank_oos.py | tee gorila-pairwise-rank-oos.json
      - name: US V0 real-history OOS benchmark
        run: set -o pipefail; python research/gorila_us_v0_oos.py | tee gorila-us-v0-oos.json
      - name: Jacobian nonequilibrium OOS research
        run: set -o pipefail; python research/gorila_jacobian_noneq_oos.py | tee gorila-jacobian-noneq-oos.json
      - name: Jacobian nonequilibrium feature ablation
        run: set -o pipefail; python research/gorila_jacobian_ablation_oos.py | tee gorila-jacobian-ablation-oos.json
      - name: Nested purged pairwise ranking OOS
        run: set -o pipefail; python research/gorila_nested_pairwise_rank_oos.py | tee gorila-nested-pairwise-rank-oos.json
      - name: Nested ranking execution and universe stress
        run: set -o pipefail; python research/gorila_nested_rank_stress_oos.py | tee gorila-nested-rank-stress-oos.json
      - name: Nested ranking temporal placebo and rank IC
        run: set -o pipefail; python research/gorila_nested_rank_placebo_oos.py | tee gorila-nested-rank-placebo-oos.json
      - name: Public endpoint smoke
        run: |
          python - <<'PY'
          import httpx
          urls = [
            "https://api.argentinadatos.com/v1/cotizaciones/dolares",
            "https://api.argentinadatos.com/v1/finanzas/indices/riesgo-pais",
            "https://api.bcra.gob.ar/estadisticascambiarias/v1.0/Cotizaciones",
          ]
          import time
          for url in urls:
              last=None
              for attempt in range(3):
                  try:
                      r=httpx.get(url,timeout=20,headers={"User-Agent":"Gorila-Argentum-CI/0.1"})
                      r.raise_for_status()
                      print("PUBLIC_SOURCE_OK", url, r.status_code, len(r.content))
                      last=None
                      break
                  except Exception as exc:
                      last=exc
                      if attempt < 2:
                          time.sleep(2 ** attempt)
              if last is not None:
                  raise last
          PY
      - name: Upload OOS evidence
        uses: actions/upload-artifact@v4
        with:
          name: gorila-argentum-oos
          path: |
            gorila-oos.json
            gorila-coupling-oos.json
            gorila-coupling-regime-oos.json
            gorila-coupling-gate-oos.json
            gorila-multihorizon-wfo.json
            gorila-execution-robustness-oos.json
            gorila-nested-execution-selection-oos.json
            gorila-cross-sectional-oos.json
            gorila-pairwise-rank-oos.json
            gorila-us-v0-oos.json
            gorila-jacobian-noneq-oos.json
            gorila-jacobian-ablation-oos.json
            gorila-nested-pairwise-rank-oos.json
            gorila-nested-rank-stress-oos.json
            gorila-nested-rank-placebo-oos.json
