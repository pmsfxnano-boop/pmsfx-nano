name: Gorila Argentum Robustness Gate

on:
  push:
    branches: [gorila-argentum-v0]
  workflow_dispatch:

concurrency:
  group: gorila-argentum-robustness-gate
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt
      - name: Corrected execution lag and cost stress
        run: set -o pipefail; python research/gorila_nested_rank_stress_oos.py | tee robustness-stress.json
      - name: Temporal placebo and rank IC
        run: set -o pipefail; python research/gorila_nested_rank_placebo_oos.py | tee robustness-placebo.json
      - name: True leave-one-universe-out ranking
        run: set -o pipefail; python research/gorila_rank_universe_loo_oos.py | tee robustness-universe-loo.json
      - name: Upload robustness evidence
        uses: actions/upload-artifact@v4
        with:
          name: gorila-robustness-gate
          path: |
            robustness-stress.json
            robustness-placebo.json
            robustness-universe-loo.json
