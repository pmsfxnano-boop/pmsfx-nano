name: Gorila Argentum Hardening CI

on:
  push:
    branches: [gorila-argentum-v0-hardening]
  workflow_dispatch:

concurrency:
  group: gorila-argentum-hardening
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt pytest
      - name: Unit tests
        run: pytest -q tests/test_research_validation.py tests/test_data_snapshot.py tests/test_gorila_math.py tests/test_prediction.py tests/test_regime_validation.py tests/test_signal_timing.py tests/test_dashboard.py tests/test_drift.py tests/test_control.py tests/test_shadow.py tests/test_promotion.py tests/test_learning.py tests/test_calibration.py tests/test_storage_series.py tests/test_audit.py tests/test_security.py
      - name: Compile research scripts
        run: |
          python -m py_compile             research/gorila_data_snapshot.py             research/gorila_snapshot_oos.py             research/gorila_true_cpcv_search_audit_oos.py             research/gorila_search_audit_oos.py             research/gorila_nested_pairwise_rank_oos.py             research/gorila_nested_rank_placebo_oos.py             research/gorila_rank_universe_loo_oos.py             research/gorila_nested_rank_stress_oos.py             research/gorila_jacobian_stress_oos.py gorila_argentum/calibration.py gorila_argentum/security.py
