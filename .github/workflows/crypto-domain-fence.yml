name: Crypto domain fence

on:
  push:
  pull_request:

jobs:
  crypto-domain-fence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject non-Crypto integrations
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(gorila_argentum|ggal_shadow|bcra|byma|iol|rava|tiingo|twelve[_ -]?data|yahoo|cedear|mep|aapl|msft|nvda|tsla|nasdaq|nyse|pamp|ypfd|cepu|tgsu2|bma)'
          matches="$(git grep -nEi "$forbidden" --             ':!*.md'             ':!docs/**'             ':!frontend/index.html'             ':!frontend/public/manifest.webmanifest'             ':!frontend/src/App.tsx'             ':!gorila_crypto/config.py'             ':!.github/workflows/crypto-domain-fence.yml'             || true)"
          if [ -n "$matches" ]; then
            echo "::error::Crypto-only domain fence found prohibited non-Crypto integration references:"
            printf '%s\n' "$matches"
            exit 1
          fi
