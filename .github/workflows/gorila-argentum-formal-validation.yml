name: Gorila Argentum Formal Validation Pipeline

on:
  push:
    branches: [gorila-argentum-v0]
  workflow_dispatch:

concurrency:
  group: gorila-argentum-formal-validation
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  ranking:
    name: Nested ranking + corrected placebo + LOO
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt pytest
      - name: Core tests
        run: pytest -q tests/test_gorila_math.py tests/test_prediction.py tests/test_regime_validation.py tests/test_signal_timing.py tests/test_research_validation.py tests/test_data_snapshot.py
      - name: Snapshot market inputs
        run: python research/gorila_snapshot_oos.py --output gorila-market-snapshot.json
      - name: Nested purged ranking
        env:
          GORILA_DATA_SNAPSHOT: ${{ github.workspace }}/gorila-market-snapshot.json
        run: set -o pipefail; python research/gorila_nested_pairwise_rank_oos.py | tee ranking-nested.json
      - name: Corrected temporal placebo
        env:
          GORILA_HORIZONS: "5,10"
          GORILA_DATA_SNAPSHOT: ${{ github.workspace }}/gorila-market-snapshot.json
        run: set -o pipefail; python research/gorila_nested_rank_placebo_oos.py | tee ranking-placebo.json
      - name: Corrected universe LOO
        env:
          GORILA_HORIZONS: "5,10"
          GORILA_DATA_SNAPSHOT: ${{ github.workspace }}/gorila-market-snapshot.json
        run: set -o pipefail; python research/gorila_rank_universe_loo_oos.py | tee ranking-universe-loo.json
      - name: Upload ranking evidence
        uses: actions/upload-artifact@v4
        with:
          name: gorila-formal-ranking
          path: |
            gorila-market-snapshot.json
            ranking-nested.json
            ranking-placebo.json
            ranking-universe-loo.json

  robustness:
    name: Horizon/cost/lag robustness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        horizon: [5, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt
      - name: Snapshot market inputs
        run: python research/gorila_snapshot_oos.py --output gorila-market-snapshot.json
      - name: Stress
        env:
          GORILA_HORIZONS: "${{ matrix.horizon }}"
          GORILA_DATA_SNAPSHOT: ${{ github.workspace }}/gorila-market-snapshot.json
        run: set -o pipefail; python research/gorila_nested_rank_stress_oos.py | tee robustness-stress-${{ matrix.horizon }}d.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gorila-formal-stress-${{ matrix.horizon }}d
          path: |
            gorila-market-snapshot.json
            robustness-stress-${{ matrix.horizon }}d.json

  jacobian:
    name: Jacobian WFO stress
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt
      - name: Snapshot market inputs
        run: python research/gorila_snapshot_oos.py --output gorila-market-snapshot.json
      - name: Jacobian stress
        env:
          GORILA_DATA_SNAPSHOT: ${{ github.workspace }}/gorila-market-snapshot.json
        run: set -o pipefail; python research/gorila_jacobian_stress_oos.py | tee jacobian-stress.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gorila-formal-jacobian
          path: |
            gorila-market-snapshot.json
            jacobian-stress.json

  search_audit:
    name: Search-aware PBO/DSR audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt
      - name: Snapshot market inputs
        run: python research/gorila_snapshot_oos.py --output gorila-market-snapshot.json
      - name: Search-aware PBO/DSR
        env:
          GORILA_DATA_SNAPSHOT: ${{ github.workspace }}/gorila-market-snapshot.json
        run: set -o pipefail; python research/gorila_search_audit_oos.py | tee gorila-search-audit.json
      - name: Upload search audit
        uses: actions/upload-artifact@v4
        with:
          name: gorila-formal-search-audit
          path: |
            gorila-market-snapshot.json
            gorila-search-audit.json

  audit:
    name: Evidence manifest
    needs: [ranking, robustness, jacobian, search_audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Build manifest
        env:
          RANKING_RESULT: ${{ needs.ranking.result }}
          ROBUSTNESS_RESULT: ${{ needs.robustness.result }}
          JACOBIAN_RESULT: ${{ needs.jacobian.result }}
          SEARCH_RESULT: ${{ needs.search_audit.result }}
        run: |
          python - <<'PY'
          import json, os
          results = {
              "ranking": os.environ["RANKING_RESULT"],
              "robustness": os.environ["ROBUSTNESS_RESULT"],
              "jacobian": os.environ["JACOBIAN_RESULT"],
              "search_audit": os.environ["SEARCH_RESULT"],
          }
          complete = all(v == "success" for v in results.values())
          manifest = {
              "status": "COMPLETE" if complete else "FAILED",
              "commit": os.environ.get("GITHUB_SHA"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "gates": results,
              "formal_search_gate": {
                  "nested_wfo_pbo_dsr": "PASS" if results["search_audit"] == "success" else "FAIL",
                  "true_cpcv": "PENDING_TRUE_CPCV_IMPLEMENTATION",
                  "note": "The current search audit is nested purged WFO PBO/DSR, not a true combinatorial purged cross-validation path analysis.",
              },
          }
          with open("gorila-formal-validation-manifest.json","w") as f:
              json.dump(manifest,f,indent=2)
          print(json.dumps(manifest,indent=2))
          PY
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: gorila-formal-validation-manifest
          path: gorila-formal-validation-manifest.json

