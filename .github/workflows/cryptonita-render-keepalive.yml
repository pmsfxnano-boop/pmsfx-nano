name: cryptonita-render-keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Ping Cryptonita capture health
        shell: bash
        run: |
          set -euo pipefail
          url="https://gorila-crypto-cleanroom-binance-capture.onrender.com/api/crypto/health"
          curl             --fail --silent --show-error             --connect-timeout 15             --max-time 50             --retry 4             --retry-all-errors             --retry-delay 2             "$url"             -o /tmp/cryptonita-health.json
          cat /tmp/cryptonita-health.json
