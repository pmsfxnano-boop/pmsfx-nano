name: Gorila Argentum Learning Integrity

on:
  push:
    branches: [gorila-argentum-v0-hardening]
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  learning-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt pytest
      - name: Learning tests
        run: pytest -q tests/test_learning.py tests/test_promotion.py tests/test_shadow.py tests/test_control.py tests/test_security.py
      - name: Compile learning runner
        run: python -m py_compile scripts/gorila_continuous_learning.py gorila_argentum/learning.py gorila_argentum/promotion.py gorila_argentum/security.py