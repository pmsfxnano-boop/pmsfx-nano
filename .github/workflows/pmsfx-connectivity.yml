name: PMSF-X cross-asset AAPL validation

on:
  push:
    branches:
      - main
    paths:
      - "research/health.txt"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Health
        run: curl --fail --silent --show-error --connect-timeout 15 --max-time 30 https://pmsfx-nano.onrender.com/health
      - name: Start research
        run: curl --fail --silent --show-error --connect-timeout 20 --max-time 30 -X POST https://pmsfx-nano.onrender.com/api/research/cross-asset/AAPL -o /tmp/start.json
      - name: Poll research
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(python -c 'import json; print(json.load(open("/tmp/start.json"))["run_id"])')"
          echo "run_id=$run_id"
          for i in $(seq 1 180); do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://pmsfx-nano.onrender.com/api/research/run/$run_id" -o /tmp/status.json
            status="$(python -c 'import json; print(json.load(open("/tmp/status.json")).get("status","UNKNOWN"))')"
            echo "status=$status"
            if [ "$status" = "COMPLETED" ] || [ "$status" = "ERROR" ]; then
              break
            fi
            sleep 5
          done
          python -c 'import json; p=json.load(open("/tmp/status.json")); print(json.dumps(((p.get("result") or {}).get("validation") or {}), indent=2))'
