name: Gorila Argentum Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/gorila-argentum-frontend-ci.yml"
  workflow_dispatch:

  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/gorila-argentum-frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
