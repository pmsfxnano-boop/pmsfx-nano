name: gorila-tests

on:
  push:
    branches:
      - gorila-argentum-v0-hardening
      - block-u-autonomous-hardening
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-gorila.txt pytest
      - name: Run tests
        run: pytest -q
