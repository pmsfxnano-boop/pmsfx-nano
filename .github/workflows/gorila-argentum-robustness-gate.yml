name: Gorila Argentum Robustness Gate

on:
  push:
    branches: [gorila-argentum-v0]
  workflow_dispatch:

concurrency:
  group: gorila-argentum-global-research
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        horizon: [5, 10]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt
      - name: Corrected lag/cost stress
        env:
          GORILA_HORIZONS: "${{ matrix.horizon }}"
        run: set -o pipefail; python research/gorila_nested_rank_stress_oos.py | tee robustness-stress-${{ matrix.horizon }}d.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: robustness-stress-${{ matrix.horizon }}d
          path: robustness-stress-${{ matrix.horizon }}d.json

  placebo:
    strategy:
      fail-fast: false
      matrix:
        horizon: [5, 10]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt
      - name: Temporal placebo and rank IC
        env:
          GORILA_HORIZONS: "${{ matrix.horizon }}"
        run: set -o pipefail; python research/gorila_nested_rank_placebo_oos.py | tee robustness-placebo-${{ matrix.horizon }}d.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: robustness-placebo-${{ matrix.horizon }}d
          path: robustness-placebo-${{ matrix.horizon }}d.json

  universe_loo:
    strategy:
      fail-fast: false
      matrix:
        horizon: [5, 10]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt
      - name: True leave-one-universe-out
        env:
          GORILA_HORIZONS: "${{ matrix.horizon }}"
        run: set -o pipefail; python research/gorila_rank_universe_loo_oos.py | tee robustness-universe-loo-${{ matrix.horizon }}d.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: robustness-universe-loo-${{ matrix.horizon }}d
          path: robustness-universe-loo-${{ matrix.horizon }}d.json
