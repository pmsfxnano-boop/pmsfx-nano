name: PMSF-X professional research validation

on:
  push:
    branches:
      - main
    paths:
      - "research/run.txt"

jobs:
  validate-multihorizon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for Render health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Health check $attempt/30"
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20               https://pmsfx-nano.onrender.com/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            sleep 10
          done
          test -s /tmp/health.json

      - name: Run AAPL professional validation
        shell: bash
        run: |
          set +e
          curl --fail --silent --show-error             --connect-timeout 20             --max-time 900             -o /tmp/aapl.json             -w "HTTP_STATUS=%{http_code}\nTIME_TOTAL=%{time_total}\n"             https://pmsfx-nano.onrender.com/api/research/multihorizon/AAPL
          rc=$?
          echo "CURL_RC=$rc"
          echo "=== RESPONSE ==="
          cat /tmp/aapl.json || true
          test "$rc" -eq 0

      - name: Print validation evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open("/tmp/aapl.json", "r", encoding="utf-8") as fh:
              payload = json.load(fh)

          validation = payload["validation"]
          print(json.dumps({
              "symbol": "AAPL",
              "status": validation.get("status"),
              "validated": validation.get("validated"),
              "sample_counts": validation.get("sample_counts"),
              "specialist_oos_counts": validation.get("specialist_oos_counts"),
              "cross_fitted_meta_count": validation.get("cross_fitted_meta_count"),
              "meta_fold_count": validation.get("meta_fold_count"),
              "usable_fold_count": validation.get("usable_fold_count"),
              "oos_count": validation.get("oos_count"),
              "metrics": validation.get("metrics"),
              "primary_300s_metrics": validation.get("primary_300s_metrics"),
              "delta_brier_vs_300s": validation.get("delta_brier_vs_300s"),
              "bootstrap_vs_baseline": validation.get("bootstrap"),
              "bootstrap_vs_300s": validation.get("primary_300s_bootstrap"),
              "gate": validation.get("gate"),
              "research_run_id": payload.get("research_run_id"),
          }, indent=2))
          PY
