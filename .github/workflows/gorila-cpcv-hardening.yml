name: Gorila Argentum True CPCV Audit

on:
  push:
    branches: [gorila-argentum-v0-hardening]
  workflow_dispatch:

concurrency:
  group: gorila-argentum-cpcv
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  cpcv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt
      - name: Snapshot market inputs
        run: python research/gorila_snapshot_oos.py --output gorila-market-snapshot.json
      - name: True CPCV search audit
        env:
          GORILA_DATA_SNAPSHOT: ${{ github.workspace }}/gorila-market-snapshot.json
        run: set -o pipefail; python research/gorila_true_cpcv_search_audit_oos.py | tee gorila-true-cpcv.json
      - name: Upload CPCV evidence
        uses: actions/upload-artifact@v4
        with:
          name: gorila-true-cpcv-audit
          path: |
            gorila-market-snapshot.json
            gorila-true-cpcv.json
