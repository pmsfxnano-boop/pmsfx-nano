name: Gorila Argentum Jacobian Stress Gate

on:
  push:
    branches: [gorila-argentum-v0]
  workflow_dispatch:

concurrency:
  group: gorila-argentum-global-research
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  jacobian-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt
      - name: Jacobian WFO stress
        run: set -o pipefail; python research/gorila_jacobian_stress_oos.py | tee jacobian-stress.json
      - name: Upload Jacobian stress evidence
        uses: actions/upload-artifact@v4
        with:
          name: gorila-jacobian-stress
          path: jacobian-stress.json
