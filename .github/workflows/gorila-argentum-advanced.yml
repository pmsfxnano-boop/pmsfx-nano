name: Gorila Argentum Advanced Research

on:
  workflow_dispatch:

concurrency:
  group: gorila-argentum-global-research
  cancel-in-progress: true

env:
  group: gorila-argentum-advanced-research
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  advanced:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gorila.txt
      - name: Jacobian feature ablation
        run: set -o pipefail; python research/gorila_jacobian_ablation_oos.py | tee advanced-jacobian-ablation.json
      - name: Nested purged pairwise ranking
        run: set -o pipefail; python research/gorila_nested_pairwise_rank_oos.py | tee advanced-nested-pairwise.json
      - name: Nested ranking execution and lag stress
        run: set -o pipefail; python research/gorila_nested_rank_stress_oos.py | tee advanced-rank-stress.json
      - name: Nested ranking temporal placebo and rank IC
        run: set -o pipefail; python research/gorila_nested_rank_placebo_oos.py | tee advanced-rank-placebo.json
      - name: True leave-one-universe-out ranking
        run: set -o pipefail; python research/gorila_rank_universe_loo_oos.py | tee advanced-universe-loo.json
      - name: Upload advanced evidence
        uses: actions/upload-artifact@v4
        with:
          name: gorila-argentum-advanced
          path: |
            advanced-jacobian-ablation.json
            advanced-nested-pairwise.json
            advanced-rank-stress.json
            advanced-rank-placebo.json
            advanced-universe-loo.json
