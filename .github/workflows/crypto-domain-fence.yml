name: Crypto domain fence

on:
  push:
  pull_request:

jobs:
  crypto-domain-fence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject legacy non-Crypto modules
        shell: bash
        run: |
          set -euo pipefail
          bad_paths="$(git ls-files | grep -Ei '(^|/)(gorila_argentum|ggal_shadow)(/|\.|$)' || true)"
          if [ -n "$bad_paths" ]; then
            echo "::error::Legacy non-Crypto modules detected:"
            printf '%s\n' "$bad_paths"
            exit 1
          fi

      - name: Reject non-Crypto integrations
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|[^A-Za-z0-9])(bcra|byma|iol|rava|tiingo|twelve[_ -]?data|yahoo|cedear|mep|aapl|msft|nvda|tsla|nasdaq|nyse|pamp|ypfd|cepu|tgsu2|bma)([^A-Za-z0-9]|$)'
          matches="$(git grep -nEi "$forbidden" --             ':!*.md'             ':!docs/**'             ':!.github/workflows/crypto-domain-fence.yml'             || true)"
          if [ -n "$matches" ]; then
            echo "::error::Crypto-only domain fence found prohibited non-Crypto integration references:"
            printf '%s\n' "$matches"
            exit 1
          fi
