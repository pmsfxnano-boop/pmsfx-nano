# Canonical Binance capture service for Cryptonita.
# Exactly one live capture boundary owns the prospective Binance cohort.
# The durable ledger remains the existing Render Postgres instance.
# No cross-region duplicate capture is declared here.
databases:
  - name: pmsfx-nano-db
    plan: free
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: temporary-cross-region-bootstrap

services:
  - type: web
    name: gorila-crypto-cleanroom-binance-capture
    runtime: python
    region: oregon
    plan: free
    branch: gorila-crypto-binance-parallel
    buildCommand: pip install -r requirements-gorila.txt
    startCommand: uvicorn gorila_crypto.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/crypto/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pmsfx-nano-db
          property: connectionString
      - key: GORILA_CRYPTO_PROVIDER
        value: binance
      - key: GORILA_CRYPTO_SYMBOLS
        value: BTCUSDT,ETHUSDT,SOLUSDT
      - key: GORILA_CRYPTO_STREAMS
        value: trade,bookTicker,depth
      - key: GORILA_CRYPTO_DEPTH_SPEED
        value: 100ms
      - key: GORILA_CRYPTO_ENVIRONMENT
        value: cleanroom-binance
      - key: GORILA_CRYPTO_INGEST_ENABLED
        value: "true"
      - key: GORILA_CRYPTO_QUALITY_MONITOR_ENABLED
        value: "true"
      - key: GORILA_LIVE_EVENT_MAX_AGE_SECONDS
        value: "90"
      - key: GORILA_DELAYED_EVENT_MAX_AGE_SECONDS
        value: "1800"
      - key: GORILA_RETENTION_TRADE_HOURS
        value: "168"
      - key: GORILA_RETENTION_BOOKTICKER_HOURS
        value: "168"
      - key: GORILA_RETENTION_DEPTH_HOURS
        value: "1"
