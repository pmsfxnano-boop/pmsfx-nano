name: PMSF-X professional research validation

on:
  push:
    branches:
      - main
    paths:
      - "research/run.txt"

jobs:
  validate-multihorizon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for live service health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Health check $attempt/30"
            if curl --fail --silent --show-error --max-time 20               https://pmsfx-nano.onrender.com/health               -o /tmp/health.json; then
              cat /tmp/health.json
              echo "Service health is ready."
              break
            fi
            sleep 20
          done
          test -s /tmp/health.json

      - name: Queue professional validation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30             -X POST             https://pmsfx-nano.onrender.com/api/research/multihorizon/AAPL             -o /tmp/start.json
          cat /tmp/start.json

          run_id="$(python -c 'import json; print(json.load(open("/tmp/start.json", encoding="utf-8")).get("run_id",""))')"
          test -n "$run_id"
          printf "%s" "$run_id" > /tmp/run_id.txt

      - name: Poll professional validation
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(cat /tmp/run_id.txt)"
          for attempt in $(seq 1 90); do
            echo "Validation poll $attempt/90: $run_id"
            curl --fail --silent --show-error --max-time 30               "https://pmsfx-nano.onrender.com/api/research/run/$run_id"               -o /tmp/status.json

            status="$(python -c 'import json; print(json.load(open("/tmp/status.json", encoding="utf-8")).get("status",""))')"
            error="$(python -c 'import json; print(json.load(open("/tmp/status.json", encoding="utf-8")).get("error",""))')"
            echo "status=$status error=$error"

            if [ "$status" = "COMPLETED" ]; then
              cp /tmp/status.json /tmp/final.json
              break
            fi

            if [ "$status" = "ERROR" ]; then
              echo "Research validation failed: $error"
              cat /tmp/status.json
              exit 1
            fi

            sleep 10
          done

          test -s /tmp/final.json

      - name: Report validation evidence
        shell: bash
        run: |
          set -euo pipefail
          python -c '
          import json
          payload=json.load(open("/tmp/final.json",encoding="utf-8"))
          validation=payload["result"]["validation"]
          evidence={
              "symbol":payload.get("symbol"),
              "run_id":payload.get("run_id"),
              "status":validation.get("status"),
              "validated":validation.get("validated"),
              "sample_counts":validation.get("sample_counts"),
              "specialist_oos_counts":validation.get("specialist_oos_counts"),
              "cross_fitted_meta_count":validation.get("cross_fitted_meta_count"),
              "meta_fold_count":validation.get("meta_fold_count"),
              "usable_fold_count":validation.get("usable_fold_count"),
              "oos_count":validation.get("oos_count"),
              "metrics":validation.get("metrics"),
              "primary_300s_metrics":validation.get("primary_300s_metrics"),
              "delta_brier_vs_300s":validation.get("delta_brier_vs_300s"),
              "bootstrap_vs_baseline":validation.get("bootstrap"),
              "bootstrap_vs_300s":validation.get("primary_300s_bootstrap"),
              "ablation":validation.get("ablation"),
              "gate":validation.get("gate"),
              "research_backtest_id":payload["result"].get("research_backtest_id")
          }
          print(json.dumps(evidence,indent=2))
          '
